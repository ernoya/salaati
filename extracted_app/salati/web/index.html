<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07131A">
  <meta name="description" content="مواقيت الصلاة والأذان، اتجاه القبلة، القرآن الكريم كاملًا، الأذكار والأدعية، أسماء الله الحسنى، السبحة الإلكترونية والتقويم الهجري — يعمل بدون إنترنت.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مواقيت الصلاة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <title>مواقيت الصلاة والأذان | Prayer Now</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #07131A;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #0E2C3B 0%, #07131A 60%, #040C11 100%);
      color: #E7C173;
      z-index: 9999;
      transition: opacity .6s ease;
    }
    #loading .dome {
      width: 96px; height: 96px; margin-bottom: 18px;
      border-radius: 50% 50% 10% 10%;
      background: linear-gradient(160deg, #F3DCA4, #C79A3F);
      position: relative;
      box-shadow: 0 0 44px rgba(231,193,115,.35);
    }
    #loading .dome::after {
      content: ""; position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
      width: 26px; height: 26px; border-radius: 50%;
      box-shadow: 6px -3px 0 0 #0E2C3B, 0 0 0 3px #E7C173 inset;
      background: transparent;
    }
    #loading h1 { font-size: 20px; font-weight: 700; margin: 6px 0 2px; }
    #loading p { font-size: 12px; color: #9DB4C0; margin: 0; }
    .spinner {
      margin-top: 22px; width: 26px; height: 26px;
      border: 3px solid rgba(231,193,115,.2);
      border-top-color: #E7C173; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="dome"></div>
    <h1>مواقيت الصلاة والأذان</h1>
    <p>Prayer Times · Qibla · Quran</p>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = 0; setTimeout(function(){ el.remove(); }, 600); }
    });
  </script>
</body>
</html>
