name: salati
description: "صلاتي — مواقيت الصلاة والأذان والقبلة والأذكار والقرآن الكريم"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  geolocator: ^13.0.1
  http: ^1.2.2
  audioplayers: ^6.1.0
  flutter_compass: ^0.8.1
  intl: ^0.19.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quran.json
    - assets/audio/athan_makkah.mp3
    - assets/audio/athan_madina.mp3
    - assets/audio/athan_alafasy.mp3
    - assets/audio/notification.wav

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
