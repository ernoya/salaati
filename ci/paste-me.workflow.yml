name: Build Salati APK

on:
  push:
    branches: ['arena/**', main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salati-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Build release APK (adaptive)
        run: bash ci/scripts/build_apk.sh
      - name: Publish APK + logs to ci-artifacts branch
        if: always()
        env:
          CI_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/scripts/publish.sh
